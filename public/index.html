<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Channel WhatsApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1120;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #1e293b;
      padding: 28px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 18px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #f1f5f9;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .emoji-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .emoji-btn {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 40px;
      padding: 8px 16px;
      font-size: 24px;
      cursor: pointer;
      transition: 0.2s;
      color: #f1f5f9;
      line-height: 1;
    }
    .emoji-btn.selected {
      border-color: #38bdf8;
      background: #1e293b;
      box-shadow: 0 0 12px #38bdf866;
    }
    .emoji-btn:hover {
      transform: scale(1.05);
    }
    #selectedDisplay {
      margin-top: 12px;
      font-size: 15px;
      color: #94a3b8;
    }
    #selectedDisplay span {
      font-size: 26px;
      margin-right: 6px;
    }
    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 18px;
      color: #0b1120;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 20px #38bdf833;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px #38bdf855;
    }
    .submit-btn:disabled {
      opacity: 0.6;
      transform: none;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 16px;
      background: #0f172a;
      border-radius: 16px;
      border: 1px solid #334155;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    #result.show { display: block; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
    .footer {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ React Channel</h1>
  <div class="sub">Kirim reaksi ke postingan WhatsApp Channel</div>

  <form id="reactionForm">
    <label for="urlInput">🔗 URL Postingan</label>
    <input type="url" id="urlInput" placeholder="https://whatsapp.com/channel/.../..." required />

    <label>😊 Pilih Reaction (klik untuk pilih/batal)</label>
    <div class="emoji-grid" id="emojiGrid">
      <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
      <button type="button" class="emoji-btn" data-emoji="😂">😂</button>
      <button type="button" class="emoji-btn" data-emoji="😮">😮</button>
      <button type="button" class="emoji-btn" data-emoji="😢">😢</button>
      <button type="button" class="emoji-btn" data-emoji="😡">😡</button>
      <button type="button" class="emoji-btn" data-emoji="👍">👍</button>
      <button type="button" class="emoji-btn" data-emoji="👎">👎</button>
      <button type="button" class="emoji-btn" data-emoji="🎉">🎉</button>
      <button type="button" class="emoji-btn" data-emoji="✨">✨</button>
      <button type="button" class="emoji-btn" data-emoji="😍">😍</button>
    </div>
    <div id="selectedDisplay">Belum ada reaction dipilih.</div>

    <button type="submit" class="submit-btn" id="submitBtn">🚀 Kirim Reaction</button>
  </form>

  <div id="result"></div>
  <div class="footer">⏳ Beri jeda antar pengiriman untuk menghindari spam.</div>
</div>

<script>
  (function() {
    const form = document.getElementById('reactionForm');
    const urlInput = document.getElementById('urlInput');
    const emojiBtns = document.querySelectorAll('.emoji-btn');
    const selectedDisplay = document.getElementById('selectedDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const resultDiv = document.getElementById('result');

    let selectedEmojis = [];

    emojiBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const emoji = this.dataset.emoji;
        const index = selectedEmojis.indexOf(emoji);
        if (index > -1) {
          selectedEmojis.splice(index, 1);
          this.classList.remove('selected');
        } else {
          if (selectedEmojis.length >= 5) {
            alert('Maksimal 5 reaction.');
            return;
          }
          selectedEmojis.push(emoji);
          this.classList.add('selected');
        }
        updateDisplay();
      });
    });

    function updateDisplay() {
      if (selectedEmojis.length === 0) {
        selectedDisplay.innerHTML = 'Belum ada reaction dipilih.';
      } else {
        selectedDisplay.innerHTML = 'Dipilih: ' + selectedEmojis.map(e => `<span>${e}</span>`).join(' ');
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const url = urlInput.value.trim();
      if (!url) {
        showResult('⚠️ Masukkan URL postingan.', 'error');
        return;
      }
      if (selectedEmojis.length === 0) {
        showResult('⚠️ Pilih minimal satu reaction.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Mengirim...';
      resultDiv.classList.remove('show');

      try {
        const response = await fetch('/api/react', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, reactions: selectedEmojis })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showResult('✅ ' + (data.message || 'Reaction berhasil dikirim!'), 'success');
          if (data.account) {
            showResult(`👤 Akun: ${data.account.username}`, 'info', true);
          }
          if (data.loggedFailed && data.loggedFailed.length > 0) {
            showResult(`⚠️ Gagal: ${data.loggedFailed.join(', ')}`, 'error', true);
          }
        } else {
          showResult('❌ Gagal: ' + (data.message || 'Terjadi kesalahan.'), 'error');
        }
      } catch (err) {
        showResult('❌ Error koneksi: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 Kirim Reaction';
      }
    });

    function showResult(msg, type = 'info', append = false) {
      resultDiv.classList.add('show');
      const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
      if (!append) {
        resultDiv.innerHTML = `<div class="${className}">${msg}</div>`;
      } else {
        resultDiv.innerHTML += `<div class="${className}">${msg}</div>`;
      }
    }
  })();
</script>
</body>
</html>
